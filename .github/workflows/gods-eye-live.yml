name: God's Eye View - Live Browser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gods-eye:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project doctor
        run: npm run doctor

      - name: Start God's Eye View
        env:
          HOST: 0.0.0.0
          PORT: 4173
        run: |
          echo "Starting God's Eye View..."

          nohup npm run dev -- \
            --host 0.0.0.0 \
            --port 4173 \
            --strictPort \
            > gods-eye.log 2>&1 &

          echo $! > gods-eye.pid

          echo "Waiting for God's Eye View..."

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              echo ""
              echo "God's Eye View started successfully."
              echo ""
              break
            fi

            if [ "$i" -eq 60 ]; then
              echo ""
              echo "ERROR: God's Eye View failed to start."
              echo ""
              echo "========== GOD'S EYE LOG =========="
              cat gods-eye.log
              echo ""
              exit 1
            fi

            sleep 2
          done

      - name: Install Cloudflare Tunnel
        run: |
          echo "Installing cloudflared..."

          curl -L \
            --fail \
            --silent \
            --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared

          sudo mv cloudflared /usr/local/bin/cloudflared

          echo ""
          cloudflared --version
          echo ""

      - name: Start Cloudflare Quick Tunnel
        run: |
          echo "Starting Cloudflare Tunnel..."

          nohup cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:4173 \
            > cloudflare.log 2>&1 &

          echo $! > cloudflare.pid

          echo "Waiting for Cloudflare public URL..."

          for i in {1..60}; do

            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflare.log | head -n 1 || true)

            if [ -n "$URL" ]; then

              echo ""
              echo "============================================================"
              echo "                  GOD'S EYE VIEW IS LIVE"
              echo "============================================================"
              echo ""
              echo "PUBLIC URL:"
              echo ""
              echo "$URL"
              echo ""
              echo "============================================================"
              echo "Open the URL above in your browser."
              echo "============================================================"
              echo ""

              echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"

              break
            fi

            if [ "$i" -eq 60 ]; then
              echo ""
              echo "ERROR: Cloudflare Tunnel failed to start."
              echo ""
              echo "========== CLOUDFLARE LOG =========="
              cat cloudflare.log
              echo ""
              exit 1
            fi

            sleep 2
          done

      - name: Show connection information
        run: |
          echo ""
          echo "============================================================"
          echo "                     CONNECTION INFO"
          echo "============================================================"
          echo ""
          echo "God's Eye:"
          echo "http://127.0.0.1:4173"
          echo ""
          echo "Public URL:"
          echo "$PUBLIC_URL"
          echo ""
          echo "============================================================"
          echo ""

      - name: Keep God's Eye View running
        run: |
          echo "God's Eye View is now running."
          echo "Public URL: $PUBLIC_URL"
          echo ""

          while true; do

            if ! kill -0 "$(cat gods-eye.pid)" 2>/dev/null; then
              echo ""
              echo "ERROR: God's Eye View process stopped."
              echo ""
              echo "========== GOD'S EYE LOG =========="
              cat gods-eye.log
              exit 1
            fi

            if ! kill -0 "$(cat cloudflare.pid)" 2>/dev/null; then
              echo ""
              echo "ERROR: Cloudflare Tunnel stopped."
              echo ""
              echo "========== CLOUDFLARE LOG =========="
              cat cloudflare.log
              exit 1
            fi

            sleep 30

          done